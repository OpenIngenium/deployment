version: '3.5'

# see https://www.cloudsavvyit.com/10765/how-to-simplify-docker-compose-files-with-yaml-anchors-and-extensions/

x-log-drive: &log-drive
    logging:
      driver: splunk
      options:
        splunk-url: ${SPLUNK_URL}
        splunk-verify-connection: "false"
        splunk-token: ${SPLUNK_TOKEN}
        splunk-index: ingenium
        splunk-source: ${ING_INSTANCE}
        splunk-sourcetype: docker-log
        splunk-insecureskipverify: "true"
        splunk-format: json
        max-buffer-size: 10m
        mode: "non-blocking"
        tag: "${ING_INSTANCE}-{{.Name}}"

services:
  arangodb_archive_replica:
    <<: *log-drive

  elasticsearch_analytics:
    <<: *log-drive
  
  search_server:
    <<: *log-drive
    
  data_sync_service:
    <<: *log-drive

  report_server:
    <<: *log-drive