upstream search_server {
    ip_hash;

    # Magic: Points to container in docker-compose
    server search_server:3025;
}

upstream report_server {
    ip_hash;

    # Magic: Points to container in docker-compose
    server report_server:3003;
}

upstream arangodb_archive_replica {
    ip_hash;

    # Magic: Points to container in docker-compose
    server arangodb_archive_replica:8529;
}


# Configuration for Nginx Server

server {
    listen 443 ssl;

    server_name _; # catch-all: matches any domain this server is reached by
    ssl_certificate /etc/nginx/ssl/ing_https.crt;
    ssl_certificate_key /etc/nginx/ssl/ing_https.key;
    # SSL/TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2G; 

    # Rewrite rule for _db paths

    location /search_server/ {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        proxy_read_timeout 86400s;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass  http://search_server/;
    }   

    location /report_server/ {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        proxy_read_timeout 86400s;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://report_server/;
    }

    # This is used for Arango DB replication and web UI view
    location ~ ^/(_db|_api|_admin|_open) {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        proxy_read_timeout 86400s;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # No trailing slash to pass the original uri
        proxy_pass  http://arangodb_archive_replica;
    }

    location /health {
        return 200 'alive';
        add_header Content-Type text/plain;
    }

}
